<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head><title>Profile Settings</title></head>
<body>
<div style="width:400px; margin:50px auto;">
    <p><a th:href="@{/products}">Back to Catalog</a></p>
    <h2>Account Profile</h2>
    <p th:if="${param.success}" style="color:green;">Profile email updated successfully.</p>

    <form th:action="@{/profile}" method="post">
        Username: <input type="text" th:value="${user.username}" disabled><br><br>
        Role: <input type="text" th:value="${user.role}" disabled><br><br>
        Email: <input type="email" name="email" th:value="${user.email}" required><br><br>
        <button type="submit">Update Email</button>
    </form>
</div>
</body>
</html>
