<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head><title>Sign In</title></head>
<body>
<div style="width:300px; margin:50px auto;">
    <h2>Login</h2>
    <!-- Spring Security automatically passes login error parameters -->
    <p th:if="${param.error}" style="color:red;">Invalid username or password.</p>
    <p th:if="${param.logout}" style="color:green;">You have been signed out successfully.</p>

    <form th:action="@{/login}" method="post" autocomplete="off">
        Username: <input type="text" name="username" required><br><br>
        Password: <input type="password" name="password" required><br><br>
        <button type="submit">Sign In</button>
    </form>
    <p><a th:href="@{/register}">Create an account</a></p>
</div>
</body>
</html>
